name: build-apk

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: prepare-source
        run: |
          pwd
          ls -la
          if [ ! -d android ]; then
            for z in *.zip; do
              if [ -f "$z" ]; then unzip -o -q "$z"; fi
            done
          fi
          if [ -d tianshen ]; then
            cp -r tianshen/android . 2>/dev/null || true
          fi
          echo "--- after prepare ---"
          ls -la
          ls -la android || echo NO_ANDROID_DIR
          test -f android/settings.gradle || exit 1

      - name: setup-android-sdk
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || echo NO_SDK
          SM=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          echo "sdkmanager=$SM"
          if [ -x "$SM" ]; then
            yes 2>/dev/null | "$SM" --licenses >/dev/null 2>&1 || true
            "$SM" "platform-tools" >/dev/null 2>&1 || true
            "$SM" "platforms;android-34" >/dev/null 2>&1 || true
            "$SM" "build-tools;34.0.0" >/dev/null 2>&1 || true
          fi
          echo "--- platforms ---"
          ls "$ANDROID_HOME/platforms" || echo NO_PLATFORMS
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: setup-gradle
        run: |
          curl -sSL -o /tmp/g.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
          sudo unzip -q -o /tmp/g.zip -d /opt
          /opt/gradle-8.5/bin/gradle --version | head -5

      - name: build
        run: |
          cd android
          /opt/gradle-8.5/bin/gradle assembleDebug --no-daemon --stacktrace
          cd ..
          mkdir -p out
          find . -name "*.apk" -exec cp {} out/ \; 2>/dev/null || true
          ls -la out
          test -n "$(ls -A out)" || exit 1

      - name: upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: tianshen-apk
          path: out/*.apk

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: apk
          files: out/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
