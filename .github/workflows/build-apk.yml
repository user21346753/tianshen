name: build-apk

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: prep
        run: |
          for z in $(find . -not -path "./.git/*" -name "*.zip"); do unzip -o -q "$z"; done
          for d in angel tianshen; do
            if [ -d "$d/android" ]; then rm -rf android; cp -r "$d/android" android; break; fi
          done
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          ls android

      - name: sdk
        run: |
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM=$(command -v sdkmanager)
          yes 2>/dev/null | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
          ls "$ANDROID_HOME/platforms" || true

      - name: make-model
        id: mk
        continue-on-error: true
        timeout-minutes: 30
        run: |
          set +e
          mkdir -p android/app/src/main/assets
          cd android/app/src/main/assets

          ok () { [ -s "$1" ] && [ "$(stat -c%s "$1")" -gt 1000000 ]; }

          # ---------- 路线 A：直接下载现成的 tflite（快） ----------
          echo "=== ROUTE A: direct download ==="
          for u in \
            "https://huggingface.co/opencv/opencv_contribution/resolve/main/yolov8n/yolov8n.tflite" \
            "https://huggingface.co/opencv/opencv_contribution/resolve/main/yolov8n/yolov8n_float32.tflite"
          do
            rm -f tmp.tflite
            curl -sL --max-time 120 -o tmp.tflite "$u"
            if ok tmp.tflite; then
              mv tmp.tflite yolov8_det.tflite
              echo "DOWNLOAD OK: $u"
              break
            fi
            echo "download failed: $u"
          done
          rm -f tmp.tflite

          # ---------- 路线 B：装 ultralytics + tensorflow 后导出 ----------
          if ! ok yolov8_det.tflite; then
            echo "=== ROUTE B: pip export ==="
            python3 -m pip install --quiet --upgrade pip 2>&1 | tail -2
            python3 -m pip install --quiet ultralytics tensorflow-cpu 2>&1 | tail -5
            echo "--- versions ---"
            python3 -c "import ultralytics,tensorflow;print('ultralytics',ultralytics.__version__);print('tf',tensorflow.__version__)" 2>&1 | tail -5
            python3 - <<'PY' 2>&1 | tail -40
          import shutil, os, traceback
          for tag in ["yolov8s", "yolov8n"]:
              try:
                  print("TRY DET", tag, flush=True)
                  from ultralytics import YOLO
                  p = YOLO(tag + ".pt").export(format="tflite", imgsz=640)
                  shutil.copy(p, "yolov8_det.tflite")
                  print("DET OK", tag, os.path.getsize("yolov8_det.tflite"), flush=True)
                  break
              except Exception:
                  traceback.print_exc()
          for tag in ["yolov8n-pose"]:
              try:
                  print("TRY POSE", tag, flush=True)
                  from ultralytics import YOLO
                  p = YOLO(tag + ".pt").export(format="tflite", imgsz=640)
                  shutil.copy(p, "yolov8_pose.tflite")
                  print("POSE OK", tag, os.path.getsize("yolov8_pose.tflite"), flush=True)
                  break
              except Exception:
                  traceback.print_exc()
          PY
          fi

          echo "=== assets ==="
          ls -la
          true

      - name: model-status
        run: |
          cd android/app/src/main/assets
          D=yolov8_det.tflite
          P=yolov8_pose.tflite
          if [ -s "$D" ]; then
            echo "::notice::DET_OK size=$(stat -c%s $D)"
          else
            echo "::error::DET_MISSING - app will run in MOCK mode"
          fi
          if [ -s "$P" ]; then
            echo "::notice::POSE_OK size=$(stat -c%s $P)"
          else
            echo "::notice::POSE_MISSING - skeleton will use heuristic"
          fi

      - name: gradle
        run: |
          curl -sSL -o /tmp/g.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
          sudo unzip -q -o /tmp/g.zip -d /opt
          sudo chmod +x /opt/gradle-8.5/bin/gradle

      - name: build
        id: g
        continue-on-error: true
        run: |
          set +e
          cd android
          /opt/gradle-8.5/bin/gradle assembleDebug --no-daemon \
            -Dorg.gradle.jvmargs=-Xmx3g > /tmp/g.log 2>&1
          echo "EXIT=$?" > /tmp/e.txt
          cd ..
          mkdir -p out
          cp -v android/app/build/outputs/apk/debug/*.apk out/ 2>/dev/null
          find . -name "*.apk" -exec cp {} out/ \; 2>/dev/null
          set -e

      - name: WHY
        if: always()
        run: |
          touch /tmp/g.log /tmp/e.txt
          echo "== EXIT =="; cat /tmp/e.txt
          echo "== ERRORS =="; grep -m5 "error:" /tmp/g.log || echo "(none)"
          echo "== CAUSE =="; grep -m2 -A2 "Caused by:" /tmp/g.log || echo "(none)"
          echo "== APK =="; ls -la out || true
          true

      - name: fail-if-no-apk
        run: |
          test -n "$(ls -A out)" || { echo "::error::NO_APK"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          files: out/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
