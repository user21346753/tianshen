name: build-apk

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: prepare-source
        run: |
          echo "=== root ==="
          ls -la
          echo "=== unzip all ==="
          for z in $(find . -maxdepth 2 -name "*.zip"); do
            echo "unzip $z"
            unzip -o -q "$z"
          done
          echo "=== after unzip ==="
          ls -la
          find . -name settings.gradle -print
          if [ -d tianshen/android ]; then
            rm -rf android
            cp -r tianshen/android android
          fi
          echo "=== android ==="
          ls -la android || echo NO_ANDROID_DIR
          find android -name "*.java" -print
          test -f android/settings.gradle || { echo "FATAL: settings.gradle missing"; exit 1; }

      - name: setup-android-sdk
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || echo NO_SDK
          for SM in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
                    "$ANDROID_HOME/tools/bin/sdkmanager" \
                    "$(command -v sdkmanager)"; do
            if [ -x "$SM" ]; then
              echo "using sdkmanager: $SM"
              yes 2>/dev/null | "$SM" --licenses >/dev/null 2>&1 || true
              "$SM" "platform-tools" || true
              "$SM" "platforms;android-34" || true
              "$SM" "build-tools;34.0.0" || true
              break
            fi
          done
          echo "--- platforms ---"
          ls "$ANDROID_HOME/platforms" || echo NO_PLATFORMS
          echo "--- build-tools ---"
          ls "$ANDROID_HOME/build-tools" || echo NO_BUILDTOOLS
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: setup-gradle
        run: |
          curl -sSL -o /tmp/g.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
          sudo unzip -q -o /tmp/g.zip -d /opt
          sudo chmod +x /opt/gradle-8.5/bin/gradle
          /opt/gradle-8.5/bin/gradle --version | head -8
          java -version 2>&1 | head -3

      - name: build
        id: gradle
        continue-on-error: true
        run: |
          cd android
          /opt/gradle-8.5/bin/gradle assembleDebug \
            --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs=-Xmx3g \
            -Dorg.gradle.android.builder.sdkDownload=true 2>&1 | tee /tmp/gradle.log
          cd ..
          mkdir -p out
          find . -name "*.apk" -exec cp {} out/ \; 2>/dev/null || true
          ls -la out

      - name: show-gradle-error
        if: steps.gradle.outcome != 'success'
        run: |
          echo "########## WHAT WENT WRONG ##########"
          sed -n '/What went wrong:/,/^\* Try:/p' /tmp/gradle.log | head -40
          echo "########## ERROR LINES ##########"
          grep -n "error:" /tmp/gradle.log | head -30
          echo "########## Caused by ##########"
          grep -n -A 4 "Caused by:" /tmp/gradle.log | head -40
          echo "########## TAIL ##########"
          tail -40 /tmp/gradle.log
          exit 1

      - name: check-apk
        run: |
          test -n "$(ls -A out)" || { echo "FATAL: no apk produced"; exit 1; }
          ls -la out

      - name: upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: tianshen-apk
          path: out/*.apk

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: apk
          files: out/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
