name: build-apk

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: prepare-source
        run: |
          echo "=== repo root ==="
          ls -la
          echo "=== unzip everything ==="
          for z in $(find . -not -path "./.git/*" -name "*.zip"); do
            echo "unzip: $z"
            unzip -o -q "$z" -d "$(dirname "$z")" || echo "unzip failed: $z"
          done
          echo "=== tree depth 3 ==="
          find . -maxdepth 3 -not -path "./.git*" | head -60
          echo "=== java files ==="
          find . -not -path "./.git/*" -name "*.java" -print
          echo "=== settings.gradle files ==="
          find . -not -path "./.git/*" -name "settings.gradle" -print

      - name: build-project
        run: |
          set -e
          MJ=$(find . -not -path "./.git/*" -name "MainActivity.java" | head -1)
          DJ=$(find . -not -path "./.git/*" -name "Detector.java"    | head -1)
          HJ=$(find . -not -path "./.git/*" -name "HudView.java"     | head -1)
          echo "MJ=[$MJ] DJ=[$DJ] HJ=[$HJ]"
          if [ -z "$MJ" ] || [ -z "$DJ" ] || [ -z "$HJ" ]; then
            echo "::error::JAVA_NOT_FOUND MJ=$MJ DJ=$DJ HJ=$HJ"
            echo "FATAL: java sources not found, upload tianshen.zip to repo root"
            find . -not -path "./.git*" | head -80
            exit 1
          fi

          rm -rf android
          mkdir -p android/gradle/wrapper
          mkdir -p android/app/src/main/java/com/tianshen/hud
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/assets

          cp "$MJ" "$DJ" "$HJ" android/app/src/main/java/com/tianshen/hud/
          ls -la android/app/src/main/java/com/tianshen/hud/

          echo "--- write settings.gradle ---"
          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TianShenHud"
          include ':app'
          EOF

          echo "--- write root build.gradle ---"
          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.1.4' apply false
          }
          EOF

          echo "--- write gradle.properties ---"
          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.daemon=false
          EOF

          echo "--- write app/build.gradle ---"
          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.tianshen.hud'
              compileSdk 34

              defaultConfig {
                  applicationId "com.tianshen.hud"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              tasks.withType(JavaCompile).configureEach {
                  options.encoding = "UTF-8"
              }

              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.activity:activity:1.8.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

              def camerax = "1.3.1"
              implementation "androidx.camera:camera-core:${camerax}"
              implementation "androidx.camera:camera-camera2:${camerax}"
              implementation "androidx.camera:camera-lifecycle:${camerax}"
              implementation "androidx.camera:camera-view:${camerax}"

              implementation 'androidx.concurrent:concurrent-futures:1.1.0'
              implementation 'com.google.guava:listenablefuture:1.0'

              implementation 'org.tensorflow:tensorflow-lite:2.14.0'
          }
          EOF

          echo "--- write AndroidManifest.xml ---"
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" android:required="true" />
              <application
                  android:allowBackup="false"
                  android:label="tianshen"
                  android:hardwareAccelerated="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="landscape"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          echo "--- write res/values ---"
          cat > android/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">tianshen</string>
          </resources>
          EOF

          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowFullscreen">true</item>
              </style>
          </resources>
          EOF

          echo "placeholder" > android/app/src/main/assets/PLACEHOLDER.txt

          echo "=== project ready ==="
          find android -type f -not -path "*/build/*" | sort

      - name: setup-android-sdk
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || echo NO_SDK
          SM=""
          for c in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
                   "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" \
                   "$ANDROID_HOME/tools/bin/sdkmanager" \
                   "$(command -v sdkmanager)"; do
            if [ -x "$c" ]; then SM="$c"; break; fi
          done
          echo "sdkmanager=[$SM]"
          if [ -n "$SM" ]; then
            yes 2>/dev/null | "$SM" --licenses 2>&1 | tail -2
            "$SM" "platform-tools" 2>&1 | tail -2
            "$SM" "platforms;android-34" 2>&1 | tail -2
            "$SM" "build-tools;34.0.0" 2>&1 | tail -2
          fi
          echo "--- platforms ---"
          ls "$ANDROID_HOME/platforms" || echo NO_PLATFORMS
          echo "--- build-tools ---"
          ls "$ANDROID_HOME/build-tools" || echo NO_BUILDTOOLS
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: setup-gradle
        run: |
          curl -sSL -o /tmp/g.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
          sudo unzip -q -o /tmp/g.zip -d /opt
          sudo chmod +x /opt/gradle-8.5/bin/gradle
          /opt/gradle-8.5/bin/gradle --version 2>&1 | head -8
          java -version 2>&1 | head -3

      - name: gradle-build
        id: gradle
        continue-on-error: true
        run: |
          cd android
          /opt/gradle-8.5/bin/gradle assembleDebug \
            --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs=-Xmx3g > /tmp/gradle.log 2>&1
          echo "GRADLE_EXIT=$?" > /tmp/exit.txt
          cd ..
          mkdir -p out
          find . -name "*.apk" -exec cp {} out/ \; 2>/dev/null || true
          echo "--- apk ---"
          ls -la out

      - name: report
        if: always()
        run: |
          echo "########## GRADLE EXIT ##########"
          cat /tmp/exit.txt 2>/dev/null || echo "(no exit file)"
          {
            echo "## Gradle log tail"
            echo '```'
            tail -120 /tmp/gradle.log 2>/dev/null || echo "(no log)"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: annotate
        if: always()
        run: |
          LOG=/tmp/gradle.log
          touch "$LOG"
          sed -n '/What went wrong:/,/^\* Try:/p' "$LOG" | grep -v '^\*' | grep -v '^$' \
            | head -8 | tr '\n' '|' | cut -c1-900 \
            | sed 's/^/::error::WHAT_WENT_WRONG>> /'
          grep -m 6 "error:" "$LOG" \
            | tr '\n' '|' | cut -c1-900 \
            | sed 's/^/::error::ERROR_LINE>> /'
          grep -m 4 -A 2 "Caused by:" "$LOG" \
            | tr '\n' '|' | cut -c1-900 \
            | sed 's/^/::error::CAUSED_BY>> /'
          grep -v '^\s*$' "$LOG" | tail -12 \
            | tr '\n' '|' | cut -c1-900 \
            | sed 's/^/::error::LOG_TAIL>> /'
          if [ -n "$(ls -A out 2>/dev/null)" ]; then
            echo "::notice::APK_OK $(ls out)"
          else
            echo "::error::NO_APK"
          fi

      - name: finish
        run: |
          test -n "$(ls -A out)" || { echo "no apk produced"; exit 1; }
          ls -la out

      - name: upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: tianshen-apk
          path: out/*.apk

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: apk
          files: out/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
