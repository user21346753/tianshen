name: build-apk

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: prep
        run: |
          for z in $(find . -not -path "./.git/*" -name "*.zip"); do unzip -o -q "$z"; done
          if [ -d tianshen/android ]; then rm -rf android; cp -r tianshen/android android; fi
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          ls android

      - name: sdk
        run: |
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM=$(command -v sdkmanager)
          yes 2>/dev/null | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
          ls "$ANDROID_HOME/platforms" || true

      - name: gradle
        run: |
          curl -sSL -o /tmp/g.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
          sudo unzip -q -o /tmp/g.zip -d /opt
          sudo chmod +x /opt/gradle-8.5/bin/gradle

      - name: build
        id: g
        continue-on-error: true
        run: |
          set +e
          cd android
          /opt/gradle-8.5/bin/gradle assembleDebug --no-daemon \
            -Dorg.gradle.jvmargs=-Xmx3g > /tmp/g.log 2>&1
          echo "EXIT=$?" > /tmp/e.txt
          cd ..
          mkdir -p out
          cp -v android/app/build/outputs/apk/debug/*.apk out/ 2>/dev/null
          find . -name "*.apk" -exec cp {} out/ \; 2>/dev/null
          set -e

      - name: WHY
        if: always()
        run: |
          touch /tmp/g.log /tmp/e.txt
          echo "== EXIT =="; cat /tmp/e.txt
          echo "== ERRORS =="; grep -m5 "error:" /tmp/g.log || echo "(none)"
          echo "== CAUSE =="; grep -m2 -A2 "Caused by:" /tmp/g.log || echo "(none)"
          echo "== APK =="; ls -la out || true
          true

      - name: fail-if-no-apk
        run: |
          test -n "$(ls -A out)" || { echo "::error::NO_APK"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          files: out/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
