name: build-apk

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: build
        run: |
          for z in $(find . -not -path "./.git/*" -name "*.zip"); do unzip -o -q "$z"; done
          for d in angel tianshen; do
            if [ -f "$d/ci-build.sh" ]; then cp "$d/ci-build.sh" . && break; fi
          done
          chmod +x ci-build.sh
          bash ci-build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          files: out/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
