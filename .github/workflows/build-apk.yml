：5.准备Gradle8.5--名称: 5.准备Gradle8.5
: |跑|跑|
如果命令-v gradle>/dev/null2>&1；，则
            echo "系统已有 gradle:"; gradle --version | head -3
          else
            echo "下载 Gradle 8.5..."
            curl -sL -o /tmp/g.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
            sudo unzip -q /tmp/g.zip -d /opt
            sudo chmod +x /opt/gradle-8.5/bin/gradle
            echo "/opt/gradle-8.5/bin" >> $GITHUB_PATH
            export PATH=/opt/gradle-8.5/bin:$PATH
          fi
          gradle --version | head -5

