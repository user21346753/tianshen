name: build-apk

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: prep
        run: |
          for z in $(find . -not -path "./.git/*" -name "*.zip"); do unzip -o -q "$z"; done
          for d in angel tianshen; do
            if [ -d "$d/android" ]; then rm -rf android; cp -r "$d/android" android; break; fi
          done
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          ls android

      - name: sdk
        run: |
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM=$(command -v sdkmanager)
          yes 2>/dev/null | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
          ls "$ANDROID_HOME/platforms" || true

      - name: make-model
        id: mk
        continue-on-error: true
        timeout-minutes: 25
        run: |
          mkdir -p android/app/src/main/assets
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet ultralytics
          cd android/app/src/main/assets
          python3 - <<'PY'
          import shutil, os, traceback
          from ultralytics import YOLO

          # 准确率优先：从大到小尝试，成功一个就停
          for tag in ["yolov8m", "yolov8s", "yolov8n"]:
              try:
                  print("TRY DET", tag, flush=True)
                  p = YOLO(tag + ".pt").export(format="tflite", imgsz=640)
                  shutil.copy(p, "yolov8_det.tflite")
                  print("DET OK", tag, os.path.getsize("yolov8_det.tflite"), flush=True)
                  break
              except Exception:
                  traceback.print_exc()

          # 姿态模型（真实骨骼关键点），同样从大到小尝试
          for tag in ["yolov8s-pose", "yolov8n-pose"]:
              try:
                  print("TRY POSE", tag, flush=True)
                  p = YOLO(tag + ".pt").export(format="tflite", imgsz=640)
                  shutil.copy(p, "yolov8_pose.tflite")
                  print("POSE OK", tag, os.path.getsize("yolov8_pose.tflite"), flush=True)
                  break
              except Exception:
                  traceback.print_exc()
          PY
          ls -la

      - name: model-status
        run: |
          cd android/app/src/main/assets
          D=yolov8_det.tflite
          P=yolov8_pose.tflite
          if [ -s "$D" ]; then
            echo "::notice::DET_OK size=$(stat -c%s $D)"
          else
            echo "::error::DET_MISSING - app will run in MOCK mode"
          fi
          if [ -s "$P" ]; then
            echo "::notice::POSE_OK size=$(stat -c%s $P)"
          else
            echo "::notice::POSE_MISSING - skeleton will use heuristic"
          fi

      - name: gradle
        run: |
          curl -sSL -o /tmp/g.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
          sudo unzip -q -o /tmp/g.zip -d /opt
          sudo chmod +x /opt/gradle-8.5/bin/gradle

      - name: build
        id: g
        continue-on-error: true
        run: |
          set +e
          cd android
          /opt/gradle-8.5/bin/gradle assembleDebug --no-daemon \
            -Dorg.gradle.jvmargs=-Xmx3g > /tmp/g.log 2>&1
          echo "EXIT=$?" > /tmp/e.txt
          cd ..
          mkdir -p out
          cp -v android/app/build/outputs/apk/debug/*.apk out/ 2>/dev/null
          find . -name "*.apk" -exec cp {} out/ \; 2>/dev/null
          set -e

      - name: WHY
        if: always()
        run: |
          touch /tmp/g.log /tmp/e.txt
          echo "== EXIT =="; cat /tmp/e.txt
          echo "== ERRORS =="; grep -m5 "error:" /tmp/g.log || echo "(none)"
          echo "== CAUSE =="; grep -m2 -A2 "Caused by:" /tmp/g.log || echo "(none)"
          echo "== APK =="; ls -la out || true
          true

      - name: fail-if-no-apk
        run: |
          test -n "$(ls -A out)" || { echo "::error::NO_APK"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          files: out/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
