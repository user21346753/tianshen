name: 构建天神辅助 APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 解压工程
        run: |
          for z in *.zip; do [ -f "$z" ] && unzip -o -q "$z" && rm -f "$z"; done
          ls -la

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK
        uses: android-actions/setup-android@v3

      - name: 准备 Gradle
        run: |
          if ! command -v gradle >/dev/null 2>&1; then
            curl -sL -o /tmp/g.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
            unzip -q /tmp/g.zip -d /opt
            echo "/opt/gradle-8.5/bin" >> $GITHUB_PATH
          fi
          gradle --version

      - name: 下载 YOLOv8n 模型（失败也能编，自动进 MOCK 模式）
        continue-on-error: true
        run: |
          mkdir -p tianshen/android/app/src/main/assets
          cd tianshen/android/app/src/main/assets
          curl -sL -o yolov8n.tflite \
            https://github.com/ultralytics/assets/releases/download/v8.3.0/yolov8n.tflite
          if [ ! -s yolov8n.tflite ]; then
            rm -f yolov8n.tflite
            pip install --quiet ultralytics
            python -c "from ultralytics import YOLO; import shutil; p=YOLO('yolov8n.pt').export(format='tflite'); shutil.copy(p,'yolov8n.tflite')"
          fi
          ls -la

      - name: 编译 Debug APK
        run: |
          cd tianshen/android
          gradle assembleDebug --no-daemon --stacktrace

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: tianshen-apk
          path: tianshen/android/app/build/outputs/apk/debug/*.apk

      - name: 发布到 Release（手机可直接下载 APK）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: 天神辅助 APK
          files: tianshen/android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

